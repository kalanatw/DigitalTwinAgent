{% extends 'base.html' %}

{% block content %}
<!-- Custom CSS for iOS 17 styling and animations -->
<style>
    /* Enhanced iOS 17 styling */
    .glass-morphism {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .chat-dropdown {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.2);
    }
    
    .button-ios {
        transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        box-shadow: 0 4px 15px 0 rgba(31, 38, 135, 0.1);
    }
    
    .button-ios:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px 0 rgba(31, 38, 135, 0.2);
    }
    
    .button-ios:active {
        transform: translateY(0px);
        transition: all 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    
    .chat-container {
        scrollbar-width: thin;
        scrollbar-color: rgba(156, 163, 175, 0.3) transparent;
    }
    
    .chat-container::-webkit-scrollbar {
        width: 6px;
    }
    
    .chat-container::-webkit-scrollbar-track {
        background: transparent;
    }
    
    .chat-container::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.3);
        border-radius: 20px;
    }
    
    .chat-container::-webkit-scrollbar-thumb:hover {
        background-color: rgba(156, 163, 175, 0.5);
    }
    
    /* Refined typing indicator */
    .typing-indicator {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    
    .typing-indicator span {
        height: 8px;
        width: 8px;
        background: #6B7280;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
    }
    
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0; }
    
    @keyframes typing {
        0%, 80%, 100% { 
            transform: scale(0.8);
            opacity: 0.5;
        }
        40% { 
            transform: scale(1);
            opacity: 1;
        }
    }
    
    /* Pulse animation for connectivity */
    .pulse-dot {
        animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    @keyframes pulse-glow {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0.7;
        }
    }
    
    /* Chat-specific markdown styles */
    .markdown-content {
        line-height: 1.6;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }
    
    .markdown-content h1, .markdown-content h2, .markdown-content h3, 
    .markdown-content h4, .markdown-content h5, .markdown-content h6 {
        font-weight: 600;
        margin: 0.8em 0 0.4em 0;
        color: inherit;
    }
    
    .markdown-content h1 { font-size: 1.3em; }
    .markdown-content h2 { font-size: 1.2em; }
    .markdown-content h3 { font-size: 1.1em; }
    .markdown-content h4 { font-size: 1.05em; }
    .markdown-content h5 { font-size: 1em; }
    .markdown-content h6 { font-size: 0.95em; }
    
    .markdown-content p {
        margin: 0.4em 0;
    }
    
    .markdown-content ul, .markdown-content ol {
        margin: 0.4em 0;
        padding-left: 1.2em;
    }
    
    .markdown-content li {
        margin: 0.1em 0;
    }
    
    .markdown-content blockquote {
        border-left: 3px solid currentColor;
        padding-left: 0.8em;
        margin: 0.8em 0;
        font-style: italic;
        opacity: 0.8;
    }
    
    /* Assistant message blockquotes */
    .bg-white\/90 .markdown-content blockquote {
        border-left-color: #6b7280;
    }
    
    /* User message blockquotes */
    .bg-gradient-to-br .markdown-content blockquote {
        border-left-color: rgba(255, 255, 255, 0.7);
    }
    
    .markdown-content code {
        background-color: rgba(0, 0, 0, 0.1);
        color: inherit;
        padding: 0.1em 0.3em;
        border-radius: 3px;
        font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        font-size: 0.85em;
    }
    
    /* User message code blocks */
    .bg-gradient-to-br .markdown-content code {
        background-color: rgba(255, 255, 255, 0.2);
        color: inherit;
    }
    
    .markdown-content pre {
        background-color: rgba(0, 0, 0, 0.05);
        padding: 0.8em;
        border-radius: 6px;
        overflow-x: auto;
        margin: 0.8em 0;
        border: 1px solid rgba(0, 0, 0, 0.1);
    }
    
    /* User message pre blocks */
    .bg-gradient-to-br .markdown-content pre {
        background-color: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.2);
    }
    
    .markdown-content pre code {
        background-color: transparent;
        padding: 0;
        border-radius: 0;
    }
    
    .markdown-content table {
        border-collapse: collapse;
        width: 100%;
        margin: 0.8em 0;
        font-size: 0.9em;
    }
    
    .markdown-content th, .markdown-content td {
        border: 1px solid rgba(0, 0, 0, 0.1);
        padding: 0.4em;
        text-align: left;
    }
    
    .markdown-content th {
        background-color: rgba(0, 0, 0, 0.05);
        font-weight: 600;
    }
    
    .markdown-content a {
        color: #3b82f6;
        text-decoration: underline;
    }
    
    /* User message links */
    .bg-gradient-to-br .markdown-content a {
        color: #93c5fd;
    }
    
    .markdown-content a:hover {
        opacity: 0.8;
    }
    
    .markdown-content strong {
        font-weight: 600;
    }
    
    .markdown-content em {
        font-style: italic;
    }
    
    .markdown-content hr {
        border: none;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
        margin: 1.5em 0;
    }
    
    /* User message hr */
    .bg-gradient-to-br .markdown-content hr {
        border-top-color: rgba(255, 255, 255, 0.3);
    }
</style>

<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 w-full" x-data="chatApp()">
    <!-- Main Chat Container -->
    <div class="w-full px-4 py-6">
        
        <!-- Chat Container with Enhanced iOS 17 Design -->
        <div class="glass-morphism rounded-3xl shadow-2xl flex flex-col border border-white/20 overflow-hidden w-full max-w-none mx-auto" style="height: calc(100vh - 200px); min-height: 600px;">
            <!-- Messages Area with Enhanced Styling -->
            <div class="flex-1 overflow-y-auto p-6 chat-container" x-ref="chatContainer">
                <!-- Welcome Message for Empty State -->
                <div x-show="messages.length === 0" class="text-center py-12">
                    <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center mx-auto mb-6">
                        <i class="fas fa-robot text-white text-2xl"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-900 mb-2">Welcome to Digital Twin Assistant</h3>
                    <p class="text-gray-600 mb-6">I can help you with sensor data, system status, and document queries.</p>
                    <div class="flex flex-wrap justify-center gap-2">
                        <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm">Sensor Data</span>
                        <span class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm">System Status</span>
                        <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm">Document Search</span>
                    </div>
                </div>

                <!-- Chat Messages -->
                <template x-for="message in messages" :key="message.id">
                    <div class="mb-4 md:mb-6" :class="message.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                        <div class="max-w-[85%] md:max-w-4xl lg:max-w-5xl"
                             :class="message.role === 'user' 
                                     ? 'bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-3xl rounded-br-xl shadow-lg' 
                                     : 'bg-white/90 text-gray-800 rounded-3xl rounded-bl-xl shadow-lg border border-gray-100'">
                            <div class="px-4 md:px-6 py-3 md:py-4">
                                <div class="flex items-start gap-3">
                                    <!-- Assistant Avatar -->
                                    <div x-show="message.role === 'assistant'" class="flex-shrink-0">
                                        <div class="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg">
                                            <i class="fas fa-robot text-white text-xs md:text-sm"></i>
                                        </div>
                                    </div>
                                    
                                    <!-- Message Content -->
                                    <div class="flex-1 min-w-0">
                                        <div x-html="renderMarkdown(message.content)" class="markdown-content leading-relaxed text-sm md:text-[15px]"></div>
                                        
                                        <!-- Tools Used Indicator -->
                                        <div x-show="message.tools_used && message.tools_used.length > 0" 
                                             class="text-xs mt-2 opacity-75 flex items-center">
                                            <i class="fas fa-tools mr-2"></i>
                                            <span class="bg-black/10 px-2 py-1 rounded-full">
                                                Tools: <span x-text="message.tools_used.join(', ')"></span>
                                            </span>
                                        </div>
                                        
                                        <!-- Timestamp -->
                                        <div class="text-xs mt-2 opacity-60" 
                                             :class="message.role === 'user' ? 'text-right text-blue-100' : 'text-left text-gray-500'"
                                             x-text="formatTime(message.timestamp)"></div>
                                    </div>
                                    
                                    <!-- User Avatar -->
                                    <div x-show="message.role === 'user'" class="flex-shrink-0">
                                        <div class="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-gray-500 to-gray-600 rounded-2xl flex items-center justify-center shadow-lg">
                                            <i class="fas fa-user text-white text-xs md:text-sm"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                
                <!-- Enhanced Typing Indicator -->
                <div x-show="isTyping" class="mb-4 md:mb-6 flex justify-start">
                    <div class="bg-white/90 rounded-3xl rounded-bl-xl px-4 md:px-6 py-3 md:py-4 shadow-lg border border-gray-100 max-w-[85%] md:max-w-xl">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg">
                                <i class="fas fa-robot text-white text-xs md:text-sm"></i>
                            </div>
                            <div class="typing-indicator">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <span class="text-gray-500 text-sm">Assistant is thinking...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Enhanced Input Area -->
            <div class="border-t border-gray-200/50 p-6 bg-white/50 backdrop-blur-sm">
                <div class="flex items-end space-x-4">
                    <!-- Quick Actions -->
                    <div class="flex space-x-2">
                        <button @click="getSensorData()" 
                                class="button-ios w-10 h-10 bg-green-100 hover:bg-green-200 text-green-600 rounded-2xl flex items-center justify-center"
                                title="Get Sensor Data">
                            <i class="fas fa-thermometer-half text-sm"></i>
                        </button>
                        <button @click="clearChat()" 
                                class="button-ios w-10 h-10 bg-red-100 hover:bg-red-200 text-red-600 rounded-2xl flex items-center justify-center"
                                title="Clear Chat">
                            <i class="fas fa-trash text-sm"></i>
                        </button>
                    </div>
                    
                    <!-- Message Input -->
                    <div class="flex-1 relative">
                        <textarea x-model="currentMessage" 
                                 @keydown.enter.prevent="!$event.shiftKey && sendMessage()"
                                 @input="autoResize($event)"
                                 placeholder="Ask about sensor data, system status, or digital twin concepts..."
                                 class="w-full border-0 bg-white/90 rounded-2xl px-6 py-4 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500/30 shadow-lg text-gray-900 placeholder-gray-500 transition-all duration-200 resize-none min-h-[52px] max-h-32"
                                 :disabled="isTyping"
                                 rows="1"></textarea>
                        
                        <!-- Loading Indicator -->
                        <div x-show="isTyping" class="absolute right-4 top-1/2 transform -translate-y-1/2">
                            <div class="animate-spin rounded-full h-5 w-5 border-2 border-blue-500 border-t-transparent"></div>
                        </div>
                        
                        <!-- Character Count (optional) -->
                        <div x-show="currentMessage.length > 0" class="absolute bottom-1 right-12 text-xs text-gray-400" 
                             x-text="currentMessage.length"></div>
                    </div>
                    
                    <!-- Send Button -->
                    <button @click="sendMessage()" 
                            :disabled="isTyping || !currentMessage.trim()"
                            class="button-ios bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 disabled:from-gray-300 disabled:to-gray-400 text-white w-12 h-12 rounded-2xl transition-all duration-200 shadow-lg disabled:shadow-sm flex items-center justify-center">
                        <i class="fas fa-paper-plane text-lg" :class="{ 'animate-pulse': isTyping }"></i>
                    </button>
                </div>
                
                <!-- Quick Suggestions -->
                <div class="flex flex-wrap gap-2 mt-4">
                    <button @click="quickMessage('Show me all sensor data from the main facility')"
                            class="text-xs px-3 py-2 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-xl transition-colors duration-200">
                        📊 All Sensor Data
                    </button>
                    <button @click="quickMessage('What is the current system status?')"
                            class="text-xs px-3 py-2 bg-green-50 hover:bg-green-100 text-green-600 rounded-xl transition-colors duration-200">
                        ⚡ System Status
                    </button>
                    <button @click="quickMessage('Explain what a digital twin is and its benefits')"
                            class="text-xs px-3 py-2 bg-purple-50 hover:bg-purple-100 text-purple-600 rounded-xl transition-colors duration-200">
                        🤖 About Digital Twins
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Indicator with Enhanced Design -->
    <div class="fixed bottom-6 right-6 z-30">
        <div class="glass-morphism rounded-2xl shadow-xl p-4 border border-white/30">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div :class="isConnected ? 'bg-green-500' : 'bg-red-500'" 
                         class="w-3 h-3 rounded-full pulse-dot"></div>
                </div>
                <div class="text-sm font-medium text-gray-700">
                    <div x-text="isConnected ? 'Connected' : 'Disconnected'"></div>
                    <div class="text-xs text-gray-500" x-text="twinVersions.length + ' twins available'"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function chatApp() {
    return {
        // State variables
        messages: [],
        currentMessage: '',
        isTyping: false,
        isConnected: true,
        sessionId: '',
        
        // Twin Version state
        twinVersions: [],
        selectedTwinVersion: null,

        // Markdown rendering function
        renderMarkdown(content) {
            if (typeof marked === 'undefined') {
                // Fallback if marked is not loaded
                return content.replace(/\n/g, '<br>');
            }
            
            try {
                // Configure marked for safety and syntax highlighting
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    highlight: function(code, lang) {
                        if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                            try {
                                return hljs.highlight(code, { language: lang }).value;
                            } catch (err) {}
                        }
                        return code;
                    }
                });
                
                return marked.parse(content);
            } catch (error) {
                console.warn('Error rendering markdown:', error);
                return content.replace(/\n/g, '<br>');
            }
        },

        // Initialize the component
        async init() {
            // Show twin selector in navbar
            this.showNavbarTwinSelector();
            
            // Generate session ID first
            this.sessionId = this.getStoredSessionId() || this.generateSessionId();
            
            // Load twin versions
            await this.loadTwinVersions();
            // Load conversation history if available
            this.loadHistory();
            // Check connection status
            this.checkConnection();
        },

        // Show twin selector in navbar (only on chat page)
        showNavbarTwinSelector() {
            // Show desktop twin selector
            const navbarSelector = document.getElementById('navbar-twin-selector');
            if (navbarSelector) {
                navbarSelector.classList.remove('hidden');
                this.setupNavbarTwinSelector();
            }
            
            // Show mobile twin selector
            const navbarSelectorMobile = document.getElementById('navbar-twin-selector-mobile');
            if (navbarSelectorMobile) {
                navbarSelectorMobile.classList.remove('hidden');
                this.setupNavbarTwinSelectorMobile();
            }
        },

        // Setup desktop navbar twin selector functionality
        setupNavbarTwinSelector() {
            const navbarTwinName = document.getElementById('navbar-twin-name');
            const navbarDropdown = document.getElementById('navbar-twin-dropdown');
            
            if (!navbarDropdown) return;

            // Create dropdown content for desktop
            navbarDropdown.innerHTML = `
                <div class="chat-dropdown rounded-3xl border border-white/30 overflow-hidden bg-white/95 backdrop-blur-25">
                    <div class="p-4 border-b border-gray-100/50">
                        <div class="flex items-center justify-between">
                            <h3 class="font-semibold text-gray-900">Twin Versions</h3>
                            <div class="text-xs text-gray-500" x-text="twinVersions.length + ' available'"></div>
                        </div>
                    </div>
                    <div class="max-h-80 overflow-y-auto">
                        <button onclick="window.chatAppInstance.selectTwinVersion(null)" 
                                class="w-full text-left p-4 hover:bg-gray-50/80 transition-colors duration-200 border-b border-gray-100/50">
                            <div class="flex items-center">
                                <div class="w-10 h-10 bg-gray-100 rounded-2xl flex items-center justify-center mr-3">
                                    <i class="fas fa-times text-gray-400"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="font-medium text-gray-900">General Mode</div>
                                    <div class="text-sm text-gray-500">Basic chat without document access</div>
                                </div>
                            </div>
                        </button>
                        <div id="navbar-twin-options"></div>
                    </div>
                </div>
            `;
            
            navbarDropdown.classList.remove('hidden');
            
            // Store reference for global access
            window.chatAppInstance = this;
        },

        // Setup mobile navbar twin selector functionality
        setupNavbarTwinSelectorMobile() {
            const navbarDropdownMobile = document.getElementById('navbar-twin-dropdown-mobile');
            
            if (!navbarDropdownMobile) return;

            // Determine appropriate width for mobile dropdown
            const isMobile = window.innerWidth < 480;
            const dropdownClass = isMobile ? 'mobile-dropdown-small' : '';

            // Create dropdown content for mobile
            navbarDropdownMobile.innerHTML = `
                <div class="chat-dropdown rounded-2xl border border-white/30 overflow-hidden bg-white/95 backdrop-blur-25 ${dropdownClass}">
                    <div class="p-3 border-b border-gray-100/50">
                        <div class="flex items-center justify-between">
                            <h3 class="font-semibold text-gray-900 text-sm">Twin Versions</h3>
                            <div class="text-xs text-gray-500" x-text="twinVersions.length + ' available'"></div>
                        </div>
                    </div>
                    <div class="max-h-64 overflow-y-auto">
                        <button onclick="window.chatAppInstance.selectTwinVersion(null)" 
                                class="w-full text-left p-3 hover:bg-gray-50/80 transition-colors duration-200 border-b border-gray-100/50">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-gray-100 rounded-xl flex items-center justify-center mr-3">
                                    <i class="fas fa-times text-gray-400 text-xs"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="font-medium text-gray-900 text-sm">General Mode</div>
                                    <div class="text-xs text-gray-500">Basic chat without document access</div>
                                </div>
                            </div>
                        </button>
                        <div id="navbar-twin-options-mobile"></div>
                    </div>
                </div>
            `;
            
            navbarDropdownMobile.classList.remove('hidden');
            
            // Update dropdown position on window resize for mobile
            window.addEventListener('resize', () => {
                const newIsMobile = window.innerWidth < 480;
                const dropdown = navbarDropdownMobile.querySelector('.chat-dropdown');
                if (newIsMobile !== isMobile && dropdown) {
                    dropdown.classList.toggle('mobile-dropdown-small', newIsMobile);
                }
            });
        },

        // Update navbar twin selector when versions are loaded
        updateNavbarTwinSelector() {
            const navbarTwinName = document.getElementById('navbar-twin-name');
            const navbarTwinOptions = document.getElementById('navbar-twin-options');
            const navbarTwinOptionsMobile = document.getElementById('navbar-twin-options-mobile');
            
            // Update desktop twin name
            if (navbarTwinName) {
                navbarTwinName.textContent = this.selectedTwinVersion 
                    ? `${this.selectedTwinVersion.name} v${this.selectedTwinVersion.version}`
                    : 'Select Twin';
            }
            
            // Create twin options HTML template
            const createTwinOption = (version, isMobile = false) => {
                const sizeClass = isMobile ? 'w-8 h-8' : 'w-10 h-10';
                const iconSizeClass = isMobile ? 'text-xs' : 'text-sm';
                const titleSizeClass = isMobile ? 'text-sm' : '';
                const descSizeClass = isMobile ? 'text-xs' : 'text-sm';
                const paddingClass = isMobile ? 'p-3' : 'p-4';
                const marginClass = isMobile ? 'mr-3' : 'mr-3';
                const borderRadiusClass = isMobile ? 'rounded-xl' : 'rounded-2xl';
                
                return `
                    <button onclick="window.chatAppInstance.selectTwinVersion(${JSON.stringify(version).replace(/"/g, '&quot;')})" 
                            class="w-full text-left ${paddingClass} hover:bg-purple-50/80 transition-colors duration-200 border-b border-gray-100/50 last:border-b-0">
                        <div class="flex items-center">
                            <div class="${sizeClass} bg-gradient-to-br from-purple-500 to-blue-600 ${borderRadiusClass} flex items-center justify-center ${marginClass}">
                                <i class="fas fa-layer-group text-white ${iconSizeClass}"></i>
                            </div>
                            <div class="flex-1">
                                <div class="font-medium text-gray-900 ${titleSizeClass}">${version.name} v${version.version}</div>
                                <div class="${descSizeClass} text-gray-500">${version.document_count} documents • ${version.description || 'No description'}</div>
                            </div>
                            ${this.selectedTwinVersion && this.selectedTwinVersion.id === version.id ? 
                                '<div class="w-5 h-5 bg-blue-500 rounded-full flex items-center justify-center ml-2"><i class="fas fa-check text-white text-xs"></i></div>' : ''}
                        </div>
                    </button>
                `;
            };
            
            // Update desktop twin options
            if (navbarTwinOptions) {
                navbarTwinOptions.innerHTML = this.twinVersions.map(version => createTwinOption(version, false)).join('');
            }
            
            // Update mobile twin options
            if (navbarTwinOptionsMobile) {
                navbarTwinOptionsMobile.innerHTML = this.twinVersions.map(version => createTwinOption(version, true)).join('');
            }
        },

        // Load twin versions
        async loadTwinVersions() {
            try {
                const response = await fetch('/api/twin-versions/');
                if (response.ok) {
                    const data = await response.json();
                    this.twinVersions = data.twin_versions || data;
                    this.updateNavbarTwinSelector();
                }
            } catch (error) {
                console.warn('Could not load twin versions:', error);
                this.twinVersions = [];
            }
        },

        // Select twin version
        selectTwinVersion(version) {
            this.selectedTwinVersion = version;
            // Generate new session when twin version changes
            this.sessionId = this.generateSessionId();
            // Clear current messages
            this.messages = [];
            
            // Update navbar display
            this.updateNavbarTwinSelector();
            
            if (version) {
                this.addMessage('assistant', `Switched to ${version.name} v${version.version}. I now have access to ${version.document_count} documents for this twin version. How can I help you?`);
            } else {
                this.addMessage('assistant', 'Switched to general mode. I can help with sensor data, system status, and general digital twin concepts.');
            }
        },

        // Get stored session ID from localStorage
        getStoredSessionId() {
            try {
                return localStorage.getItem('sessionId');
            } catch (error) {
                console.warn('LocalStorage not available:', error);
                return null;
            }
        },

        // Generate new session ID
        generateSessionId() {
            const sessionId = 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            try {
                localStorage.setItem('sessionId', sessionId);
            } catch (error) {
                console.warn('Could not save session ID to localStorage:', error);
            }
            return sessionId;
        },

        // Send message to the chat API
        async sendMessage() {
            if (!this.currentMessage.trim() || this.isTyping) return;

            const message = this.currentMessage.trim();
            this.currentMessage = '';

            // Add user message immediately
            this.addMessage('user', message);
            this.isTyping = true;
            this.scrollToBottom();

            try {
                const payload = {
                    message: message,
                    session_id: this.sessionId
                };

                // Include twin version ID if selected for document context
                if (this.selectedTwinVersion) {
                    payload.twin_version_id = this.selectedTwinVersion.id;
                }

                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'success') {
                    this.addMessage('assistant', data.response, data.metadata?.tools_used || []);
                    this.isConnected = true;
                    
                    // Show document context if provided
                    if (data.metadata?.document_context) {
                        this.showDocumentContext(data.metadata.document_context);
                    }
                } else {
                    this.addMessage('assistant', `Sorry, I encountered an error: ${data.message || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Chat error:', error);
                this.addMessage('assistant', 'Sorry, I cannot connect to the server right now. Please check your connection and try again.');
                this.isConnected = false;
            } finally {
                this.isTyping = false;
                this.scrollToBottom();
            }
        },

        // Show document context information
        showDocumentContext(documentContext) {
            if (documentContext && documentContext.length > 0) {
                const contextInfo = `📄 Reference: Found relevant information in ${documentContext.length} document(s): ${documentContext.map(doc => doc.title).join(', ')}`;
                this.addMessage('assistant', contextInfo, ['document_search']);
            }
        },

        // Send quick message
        quickMessage(message) {
            this.currentMessage = message;
            this.sendMessage();
        },

        // Add message to the conversation
        addMessage(role, content, tools_used = []) {
            const message = {
                id: Date.now() + Math.random(),
                role: role,
                content: content,
                tools_used: tools_used || [],
                timestamp: new Date()
            };
            
            this.messages.push(message);
            
            // Auto-scroll to bottom after DOM update
            this.$nextTick(() => {
                this.scrollToBottom();
            });
        },

        // Clear chat history
        async clearChat() {
            if (confirm('Are you sure you want to clear the chat history?')) {
                this.messages = [];
                
                // Generate new session (no server-side history to clear for now)
                this.sessionId = this.generateSessionId();
                
                // Add welcome message
                this.addMessage('assistant', 'Chat cleared! How can I help you today?');
            }
        },

        // Get sensor data via quick message
        async getSensorData() {
            this.quickMessage('Show me the current sensor readings for all locations');
        },

        // Scroll to bottom of chat
        scrollToBottom() {
            try {
                const container = this.$refs.chatContainer;
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            } catch (error) {
                console.warn('Could not scroll to bottom:', error);
            }
        },

        // Auto-resize textarea
        autoResize(event) {
            const textarea = event.target;
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 128) + 'px';
        },

        // Format timestamp
        formatTime(timestamp) {
            try {
                const date = new Date(timestamp);
                return date.toLocaleTimeString([], { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });
            } catch (error) {
                return 'Invalid time';
            }
        },

        // Load conversation history (simplified for now)
        async loadHistory() {
            // For now, just add a welcome message
            if (this.messages.length === 0) {
                this.addMessage('assistant', 'Hello! I\'m your Digital Twin Assistant. I can help you with sensor data, system status, and document queries. Select a twin version from the navbar to access specific documents.');
            }
        },

        // Check connection status
        async checkConnection() {
            try {
                const response = await fetch('/api/twin-versions/', {
                    method: 'GET',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                    }
                });
                this.isConnected = response.ok;
            } catch (error) {
                this.isConnected = false;
                console.warn('Connection check failed:', error);
            }
        }
    }
}
</script>
