<!-- Email List Component -->
<!-- This component shares the parent app's data context -->
<div>
    
    <!-- Loading Spinner -->
    <div x-show="isLoading" class="flex items-center justify-center py-12">
        <div class="flex flex-col items-center gap-4 text-white/70">
            <div class="w-12 h-12 border-4 border-blue-400/30 border-t-blue-400 rounded-full animate-spin"></div>
            <span class="text-lg">Loading emails...</span>
        </div>
    </div>

    <!-- Error Message -->
    <div x-show="errorMessage" class="bg-red-500/20 border border-red-500/30 rounded-lg p-4 mb-6">
        <div class="flex items-start gap-3 text-red-400">
            <i class="fas fa-exclamation-circle text-xl mt-1"></i>
            <div>
                <div class="font-semibold">Error</div>
                <div x-text="errorMessage" class="text-sm mt-1"></div>
            </div>
        </div>
    </div>

    <!-- Email List -->
    <div x-show="emails.length > 0 && !isLoading" class="space-y-4">
        <template x-for="email in emails" :key="email.id">
            <div @click="handleEmailSelection(email)" 
                 class="email-card relative p-5 hover:bg-white/10 cursor-pointer transition-all transform hover:scale-[1.02]"
                 :class="{ 
                     'unread': email.is_unread, 
                     'selected': selectedEmailId === email.id 
                 }">
                
                <!-- Email Preview -->
                <div class="flex items-center justify-between">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center space-x-3 mb-2">
                            <div class="w-3 h-3 rounded-full" 
                                 :class="email.is_unread ? 'bg-blue-400 animate-pulse' : 'bg-gray-400'"></div>
                            <span class="text-white font-medium truncate" x-text="email.from"></span>
                            <span class="text-white/50 text-sm" x-text="formatDate(email.date)"></span>
                        </div>
                        <h4 class="text-white font-semibold mb-1 truncate" x-text="email.subject || 'No Subject'"></h4>
                        <p class="text-white/70 text-sm line-clamp-2" x-text="email.snippet"></p>
                    </div>
                    <div class="ml-4 opacity-60 group-hover:opacity-100 transition-opacity">
                        <i class="fas fa-chevron-right text-white/50"></i>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- No Emails Message -->
    <div x-show="emails.length === 0 && !isLoading && !errorMessage" class="text-center py-12">
        <div class="flex flex-col items-center gap-4">
            <i class="fas fa-inbox text-6xl text-white/20"></i>
            <div>
                <p class="text-white/70 text-lg font-medium">No emails found</p>
                <p class="text-white/50 text-sm mt-2">Try connecting your Gmail account or adjusting your search criteria</p>
            </div>
        </div>
    </div>

    <!-- Load More Button -->
    <div x-show="nextPageToken && !isLoading" class="text-center mt-8">
        <button @click="loadMoreEmails()" 
                class="btn-secondary px-8 py-4 text-lg">
            <i class="fas fa-plus mr-3"></i>
            Load More Emails
        </button>
    </div>
</div>
