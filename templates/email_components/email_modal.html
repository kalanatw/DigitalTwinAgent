<!-- Standalone Email Modal Component -->
<div x-show="selectedEmail && showEmailModal" 
     x-transition:enter="transition ease-out duration-300 transform"
     x-transition:enter-start="opacity-0 scale-95 translate-y-4"
     x-transition:enter-end="opacity-100 scale-100 translate-y-0"
     x-transition:leave="transition ease-in duration-200 transform"
     x-transition:leave-start="opacity-100 scale-100 translate-y-0"
     x-transition:leave-end="opacity-0 scale-95 translate-y-4"
     class="fixed inset-0 z-50 overflow-hidden"
     x-data="emailModalComponent()">
    
    <!-- Background overlay with blur effect -->
    <div class="absolute inset-0 modal-backdrop" 
         @click="closeModal()"></div>
    
    <!-- Modal content - Unified Interface -->
    <div class="relative flex items-center justify-center min-h-screen p-4">
        <div class="modal-card w-full max-w-6xl max-h-[95vh] overflow-hidden">
            
            <!-- Header with email details -->
            <div class="sticky top-0 bg-white/90 backdrop-blur-xl border-b border-gray-200/50 px-6 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3 flex-1 min-w-0">
                        <button @click="closeModal()" 
                                class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-all btn-animate flex-shrink-0">
                            <i class="fas fa-times text-gray-600"></i>
                        </button>
                        <div class="min-w-0 flex-1">
                            <h2 class="text-lg font-semibold text-gray-900 truncate">
                                <span x-text="selectedEmail?.subject || 'No Subject'"></span>
                            </h2>
                            <div class="flex items-center space-x-4 text-sm text-gray-600 mt-1">
                                <span class="truncate">From: <span x-text="selectedEmail?.from"></span></span>
                                <span x-text="formatDetailedDate(selectedEmail?.date)"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Quick action buttons -->
                    <div class="flex items-center space-x-2 flex-shrink-0 ml-4">
                        <button @click="setActiveTab('reply')" 
                                class="px-4 py-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white text-sm rounded-full hover:shadow-lg transform hover:scale-105 transition-all btn-animate">
                            <i class="fas fa-reply mr-2"></i>
                            Quick Reply
                        </button>
                    </div>
                </div>
                
                <!-- Tab Navigation -->
                <div class="flex space-x-1 mt-4 border-b border-gray-200">
                    <button @click="setActiveTab('view')" 
                            class="tab-button px-4 py-2 text-sm font-medium transition-all"
                            :class="activeTab === 'view' ? 'text-blue-600 active' : 'text-gray-500 hover:text-gray-700'">
                        <i class="fas fa-eye mr-2"></i>View
                    </button>
                    <button @click="setActiveTab('reply')" 
                            class="tab-button px-4 py-2 text-sm font-medium transition-all"
                            :class="activeTab === 'reply' ? 'text-blue-600 active' : 'text-gray-500 hover:text-gray-700'">
                        <i class="fas fa-reply mr-2"></i>Reply
                    </button>
                    <button @click="setActiveTab('forward')" 
                            class="tab-button px-4 py-2 text-sm font-medium transition-all"
                            :class="activeTab === 'forward' ? 'text-blue-600 active' : 'text-gray-500 hover:text-gray-700'">
                        <i class="fas fa-share mr-2"></i>Forward
                    </button>
                </div>
            </div>
            
            <!-- Tab Content Area -->
            <div class="tab-content overflow-y-auto max-h-[calc(95vh-200px)] p-6 smooth-scroll">
                
                <!-- View Tab -->
                <div x-show="activeTab === 'view'" x-transition.opacity.duration.200ms>
                    <!-- Email metadata -->
                    <div class="bg-gray-50/80 rounded-2xl p-4 mb-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                            <div>
                                <span class="font-medium text-gray-700">From:</span>
                                <span class="ml-2 text-gray-900" x-text="selectedEmail?.from"></span>
                            </div>
                            <div>
                                <span class="font-medium text-gray-700">Date:</span>
                                <span class="ml-2 text-gray-900" x-text="formatDetailedDate(selectedEmail?.date)"></span>
                            </div>
                            <div class="md:col-span-2">
                                <span class="font-medium text-gray-700">To:</span>
                                <span class="ml-2 text-gray-900" x-text="selectedEmail?.to"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Email body -->
                    <div class="prose prose-sm max-w-none">
                        <div x-html="formatEmailBody(selectedEmail?.body_html || selectedEmail?.body_text || selectedEmail?.snippet)" 
                             class="text-gray-800 leading-relaxed bg-white rounded-xl p-6 shadow-sm border border-gray-100"></div>
                    </div>
                </div>
                
                <!-- Reply Tab -->
                <div x-show="activeTab === 'reply'" x-transition.opacity.duration.200ms>
                    <!-- AI Agent Selection Panel -->
                    <div class="bg-gradient-to-r from-purple-50 to-blue-50 rounded-2xl p-6 mb-6 border border-purple-200">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-robot text-purple-500 mr-2"></i>
                            AI Response Generation
                        </h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                            <!-- Agent Selection -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Agent:</label>
                                <select x-model="selectedAgentId" @change="loadTwinVersions()" 
                                        class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <template x-for="agent in availableAgents" :key="agent.id">
                                        <option :value="agent.id" x-text="agent.name"></option>
                                    </template>
                                </select>
                            </div>
                            
                            <!-- Twin Version Selection -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Version:</label>
                                <select x-model="selectedTwinVersionId" 
                                        class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <template x-for="version in availableTwinVersions" :key="version.id">
                                        <option :value="version.id" x-text="version.name + ' (v' + version.version + ')'"></option>
                                    </template>
                                </select>
                            </div>
                            
                            <!-- Response Tone -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Tone:</label>
                                <select x-model="selectedTone" 
                                        class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <template x-for="tone in replyTones" :key="tone.value">
                                        <option :value="tone.value" x-text="tone.label"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                        
                        <!-- Generation Controls -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <label class="flex items-center">
                                    <input type="checkbox" x-model="includeContext" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <span class="ml-2 text-sm text-gray-700">Include original email</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" x-model="includeHistory" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <span class="ml-2 text-sm text-gray-700">Include thread history</span>
                                </label>
                            </div>
                            
                            <button @click="generateAIReply()" 
                                    :disabled="!selectedAgentId || !selectedTwinVersionId || isGenerating"
                                    class="px-6 py-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white rounded-xl font-medium hover:shadow-lg disabled:opacity-50 transition-all btn-animate">
                                <span x-show="!isGenerating">
                                    <i class="fas fa-magic mr-2"></i>Generate Response
                                </span>
                                <span x-show="isGenerating">
                                    <i class="fas fa-spinner fa-spin mr-2"></i>Generating...
                                </span>
                            </button>
                        </div>
                        
                        <!-- AI Generation Status -->
                        <div x-show="isGenerating" x-transition class="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-xl">
                            <div class="flex items-center space-x-3">
                                <div class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                                <div>
                                    <div class="text-blue-800 font-medium">Generating AI Response...</div>
                                    <div class="text-blue-600 text-sm">This may take a few seconds</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Email Composition Form -->
                    <div class="bg-white rounded-2xl border border-gray-200 p-6" :class="{ 'opacity-50': isGenerating }">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-edit text-green-500 mr-2"></i>
                            Compose Reply
                        </h3>
                        
                        <!-- Email Headers -->
                        <div class="space-y-4 mb-4">
                            <!-- From and To Row -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">From:</label>
                                    <input type="email" x-model="composeData.from" readonly
                                           class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-700 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">To:</label>
                                    <input type="email" x-model="composeData.to" required
                                           class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                            
                            <!-- Subject -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Subject:</label>
                                <input type="text" x-model="composeData.subject" required
                                       class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            
                            <!-- Advanced Options (Collapsible) -->
                            <div class="border-t border-gray-200 pt-4">
                                <button @click="showAdvancedOptions = !showAdvancedOptions" type="button" 
                                        class="flex items-center text-sm text-gray-600 hover:text-gray-800 transition-colors">
                                    <i class="fas" :class="showAdvancedOptions ? 'fa-chevron-down' : 'fa-chevron-right'" class="mr-2"></i>
                                    Advanced Options (CC, BCC)
                                </button>
                                
                                <div x-show="showAdvancedOptions" x-transition class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">CC:</label>
                                        <input type="text" x-model="composeData.cc" 
                                               placeholder="Separate multiple emails with commas"
                                               class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">BCC:</label>
                                        <input type="text" x-model="composeData.bcc" 
                                               placeholder="Separate multiple emails with commas"
                                               class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Email Body Editor -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Message:</label>
                            <div x-ref="emailBody" 
                                 contenteditable="true"
                                 @input="composeData.body = $refs.emailBody.innerHTML"
                                 class="w-full min-h-80 px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 prose prose-sm max-w-none"
                                 style="min-height: 300px; max-height: 400px; overflow-y: auto;">
                            </div>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="flex justify-between items-center">
                            <button @click="saveDraft()" 
                                    class="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-all btn-animate">
                                <i class="fas fa-save mr-2"></i>Save Draft
                            </button>
                            
                            <div class="flex space-x-3">
                                <button @click="previewEmail()" 
                                        class="px-4 py-2 bg-blue-100 text-blue-700 rounded-xl hover:bg-blue-200 transition-all btn-animate">
                                    <i class="fas fa-eye mr-2"></i>Preview
                                </button>
                                <button @click="sendEmail()" 
                                        :disabled="isSending || !composeData.to || !composeData.subject || !composeData.body"
                                        class="px-6 py-2 bg-gradient-to-r from-green-500 to-emerald-500 text-white rounded-xl hover:shadow-lg disabled:opacity-50 transition-all btn-animate">
                                    <i :class="isSending ? 'fas fa-spinner fa-spin' : 'fas fa-paper-plane'" class="mr-2"></i>
                                    <span x-text="isSending ? 'Sending...' : 'Send Email'"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Forward Tab -->
                <div x-show="activeTab === 'forward'" x-transition.opacity.duration.200ms>
                    <!-- Email Composition Form for Forward -->
                    <div class="bg-white rounded-2xl border border-gray-200 p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-share text-blue-500 mr-2"></i>
                            Forward Email
                        </h3>
                        
                        <!-- Forward Headers -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">From:</label>
                                <input type="email" x-model="forwardData.from" readonly
                                       class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-700 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">To:</label>
                                <input type="email" x-model="forwardData.to" required
                                       placeholder="Enter recipient email"
                                       class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">CC:</label>
                                <input type="text" x-model="forwardData.cc" 
                                       placeholder="Separate multiple emails with commas"
                                       class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">BCC:</label>
                                <input type="text" x-model="forwardData.bcc" 
                                       placeholder="Separate multiple emails with commas"
                                       class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Subject:</label>
                            <input type="text" x-model="forwardData.subject" required
                                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <!-- Forward Message and Original Email -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Your Message:</label>
                            <div x-ref="forwardMessage" 
                                 contenteditable="true"
                                 @input="forwardData.message = $refs.forwardMessage.innerHTML"
                                 class="w-full min-h-24 px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 prose prose-sm max-w-none"
                                 placeholder="Add your message here..."
                                 style="min-height: 100px; max-height: 200px; overflow-y: auto;">
                            </div>
                        </div>
                        
                        <!-- Original Email Preview -->
                        <div class="bg-gray-50 rounded-xl p-4 mb-6 border-l-4 border-blue-500">
                            <h4 class="text-sm font-semibold text-gray-900 mb-3">---------- Forwarded message ----------</h4>
                            <div class="text-sm text-gray-700 space-y-1">
                                <div><span class="font-medium">From:</span> <span x-text="selectedEmail?.from"></span></div>
                                <div><span class="font-medium">Date:</span> <span x-text="formatDetailedDate(selectedEmail?.date)"></span></div>
                                <div><span class="font-medium">Subject:</span> <span x-text="selectedEmail?.subject"></span></div>
                                <div><span class="font-medium">To:</span> <span x-text="selectedEmail?.to"></span></div>
                            </div>
                            <div class="mt-4 pt-4 border-t border-gray-200">
                                <div x-html="formatEmailBody(selectedEmail?.body_html || selectedEmail?.body_text || selectedEmail?.snippet)" 
                                     class="text-gray-700 leading-relaxed prose prose-sm max-w-none"></div>
                            </div>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="flex justify-between items-center">
                            <button @click="saveForwardDraft()" 
                                    class="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-all btn-animate">
                                <i class="fas fa-save mr-2"></i>Save Draft
                            </button>
                            
                            <div class="flex space-x-3">
                                <button @click="previewForward()" 
                                        class="px-4 py-2 bg-blue-100 text-blue-700 rounded-xl hover:bg-blue-200 transition-all btn-animate">
                                    <i class="fas fa-eye mr-2"></i>Preview
                                </button>
                                <button @click="sendForward()" 
                                        :disabled="isSending || !forwardData.to"
                                        class="px-6 py-2 bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-xl hover:shadow-lg disabled:opacity-50 transition-all btn-animate">
                                    <i :class="isSending ? 'fas fa-spinner fa-spin' : 'fas fa-share'" class="mr-2"></i>
                                    <span x-text="isSending ? 'Sending...' : 'Forward Email'"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>

<script>
function emailModalComponent() {
    return {
        activeTab: 'view',
        
        // Modal-specific state
        selectedAgentId: null,
        selectedTwinVersionId: null,
        selectedTone: 'professional',
        includeContext: true,
        includeHistory: false,
        isGenerating: false,
        isSending: false,
        showAdvancedOptions: false,
        
        // Reply tones
        replyTones: [
            { value: 'professional', label: 'Professional', icon: 'fas fa-briefcase' },
            { value: 'friendly', label: 'Friendly', icon: 'fas fa-smile' },
            { value: 'formal', label: 'Formal', icon: 'fas fa-user-tie' },
            { value: 'casual', label: 'Casual', icon: 'fas fa-coffee' }
        ],
        
        // Compose data
        composeData: {
            from: '',
            to: '',
            cc: '',
            bcc: '',
            subject: '',
            body: '',
            emailId: ''
        },

        // Forward data
        forwardData: {
            from: '',
            to: '',
            cc: '',
            bcc: '',
            subject: '',
            message: '',
            emailId: ''
        },
        
        init() {
            console.log('Email modal component initialized');
            this.activeTab = 'view';
            this.prepareReplyData();
            
            // Listen for reply generation events from parent
            this.$el.addEventListener('reply-generated', (event) => {
                console.log('Modal received reply-generated event:', event.detail);
                this.handleReplyGenerated(event.detail.replyData);
            });
            
            // Watch for data changes from parent app
            this.$watch('selectedAgentId', () => {
                if (this.selectedAgentId) {
                    this.loadTwinVersions();
                }
            });
            
            // Sync state with parent app
            this.$watch('$root.selectedAgentId', (newId) => {
                this.selectedAgentId = newId;
            });
            
            this.$watch('$root.selectedTwinVersionId', (newId) => {
                this.selectedTwinVersionId = newId;
            });
            
            this.$watch('$root.selectedTone', (newTone) => {
                this.selectedTone = newTone;
            });
            
            this.$watch('$root.isGenerating', (isGenerating) => {
                this.isGenerating = isGenerating;
            });
            
            this.$watch('$root.availableAgents', (agents) => {
                this.availableAgents = agents;
            });
            
            this.$watch('$root.availableTwinVersions', (versions) => {
                this.availableTwinVersions = versions;
            });
        },
        
        setActiveTab(tab) {
            this.activeTab = tab;
            if (tab === 'reply') {
                this.prepareReplyData();
            } else if (tab === 'forward') {
                this.prepareForwardData();
            }
        },
        
        closeModal() {
            console.log('Closing modal from component');
            // Emit event to parent to close modal
            this.$dispatch('close-email-modal');
        },
        
        prepareReplyData() {
            if (!this.selectedEmail) return;
            
            this.composeData = {
                from: this.connectionStatus?.email || '',
                to: this.selectedEmail.from,
                cc: '',
                bcc: '',
                subject: `Re: ${this.selectedEmail.subject || 'No Subject'}`,
                body: '',
                emailId: this.selectedEmail.id
            };
        },
        
        prepareForwardData() {
            if (!this.selectedEmail) return;
            
            this.forwardData = {
                from: this.connectionStatus?.email || '',
                to: '',
                cc: '',
                bcc: '',
                subject: `Fwd: ${this.selectedEmail.subject || 'No Subject'}`,
                message: '',
                emailId: this.selectedEmail.id
            };
        },
        
        // Generate AI reply using parent app's method
        generateAIReply() {
            console.log('Generate AI reply clicked from modal');
            
            // Validate selections
            if (!this.selectedAgentId || !this.selectedTwinVersionId) {
                alert('Please select an agent and twin version');
                return;
            }
            
            // Set loading state
            this.isGenerating = true;
            
            // Emit event to parent to handle AI generation
            this.$dispatch('generate-ai-reply', {
                emailId: this.selectedEmail?.id,
                agentId: this.selectedAgentId,
                twinVersionId: this.selectedTwinVersionId,
                tone: this.selectedTone,
                includeContext: this.includeContext,
                includeHistory: this.includeHistory
            });
        },
        
        handleReplyGenerated(replyData) {
            console.log('Modal: Reply generated, populating form with:', replyData);
            
            if (!replyData) {
                console.error('No reply data provided');
                return;
            }
            
            // Update compose data with the generated reply
            if (replyData.to) this.composeData.to = replyData.to;
            if (replyData.subject) this.composeData.subject = replyData.subject;
            if (replyData.body) {
                this.composeData.body = replyData.body;
                
                // Force update the textarea after a small delay to ensure DOM is ready
                setTimeout(() => {
                    const bodyTextarea = document.querySelector('textarea[x-model="composeData.body"]');
                    if (bodyTextarea) {
                        bodyTextarea.value = replyData.body;
                        bodyTextarea.dispatchEvent(new Event('input', { bubbles: true }));
                        console.log('Modal: Textarea updated with body content');
                    }
                    
                    // Also update contenteditable div if it exists
                    const emailBodyRef = this.$refs.emailBody;
                    if (emailBodyRef) {
                        emailBodyRef.innerHTML = replyData.body.replace(/\n/g, '<br>');
                        console.log('Modal: Contenteditable div updated');
                    }
                }, 100);
            }
            
            // Update CC and BCC if provided
            if (replyData.cc) this.composeData.cc = Array.isArray(replyData.cc) ? replyData.cc.join(', ') : replyData.cc;
            if (replyData.bcc) this.composeData.bcc = Array.isArray(replyData.bcc) ? replyData.bcc.join(', ') : replyData.bcc;
            
            // Switch to reply tab and show the form
            this.activeTab = 'reply';
            this.isGenerating = false;
            
            console.log('Modal: Form populated successfully with:', this.composeData);
        },
        
        async loadTwinVersions() {
            if (!this.selectedAgentId) return;
            
            try {
                console.log('Loading twin versions for agent:', this.selectedAgentId);
                
                const response = await fetch(`/api/twins/versions/?agent_id=${this.selectedAgentId}`, {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        this.availableTwinVersions = result.versions || [];
                        console.log(`Loaded ${this.availableTwinVersions.length} twin versions`);
                        
                        // Auto-select first version if available
                        if (this.availableTwinVersions.length > 0 && !this.selectedTwinVersionId) {
                            this.selectedTwinVersionId = this.availableTwinVersions[0].id;
                        }
                    }
                }
                
            } catch (error) {
                console.error('Error loading twin versions:', error);
            }
        },
        
        async sendEmail() {
            if (!this.composeData.to || !this.composeData.body) {
                alert('Please fill in the recipient and message body');
                return;
            }
            
            this.isSending = true;
            
            try {
                console.log('Sending email...', this.composeData);
                
                const response = await fetch('/api/gmail/send/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: this.composeData.to,
                        cc: this.composeData.cc,
                        bcc: this.composeData.bcc,
                        subject: this.composeData.subject,
                        body: this.composeData.body,
                        reply_to_id: this.composeData.emailId
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        alert('Email sent successfully!');
                        this.closeModal();
                    } else {
                        // Check for scope-related errors
                        if (result.error && result.error.includes('OAuth re-authorization required')) {
                            this.handleScopeError();
                        } else {
                            throw new Error(result.error || 'Failed to send email');
                        }
                    }
                } else if (response.status === 403 || response.status === 401) {
                    // Handle OAuth/scope errors
                    this.handleScopeError();
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    if (errorData.error && errorData.error.includes('invalid_scope')) {
                        this.handleScopeError();
                    } else {
                        throw new Error(`Server error: ${response.status}`);
                    }
                }
                
            } catch (error) {
                console.error('Error sending email:', error);
                
                // Check if error message indicates scope issues
                if (error.message.includes('invalid_scope') || 
                    error.message.includes('insufficient authentication scopes') ||
                    error.message.includes('OAuth re-authorization required')) {
                    this.handleScopeError();
                } else {
                    alert(`Failed to send email: ${error.message}`);
                }
            } finally {
                this.isSending = false;
            }
        },
        
        handleScopeError() {
            console.log('Handling OAuth scope error');
            
            // Notify parent app about scope error
            this.$el.dispatchEvent(new CustomEvent('scope-error-detected', {
                bubbles: true
            }));
            
            const confirmReauth = confirm(
                'Gmail permissions need to be updated to send emails.\n\n' +
                'Would you like to re-authorize with the required permissions?\n\n' +
                'This will redirect you to Google to grant additional permissions.'
            );
            
            if (confirmReauth) {
                // Redirect to re-authorization endpoint
                window.location.href = '/email/reauthorize/';
            }
        },

            if (!date) return '';
            return new Date(date).toLocaleString();

            if (!body) return '';
            return body;
        }
