{% extends 'base.html' %}

{% block content %}
{% csrf_token %}

<!-- Email Management Styles -->
<style>
/* Force full width and prevent UI shrinking */
body, html, main, .container, .main-content, .max-w-7xl {
    max-width: 100vw !important;
        // Event-driven component communication
        setupEventListeners() {
            // Listen for email selection from list component
            this.$el.addEventListener('email-selected', (event) => {
                console.log('Main app: email selected event received', event.detail);
                this.handleEmailSelection(event.detail.email);
            });
            
            // Listen for modal close from modal component
            this.$el.addEventListener('close-email-modal', () => {
                console.log('Main app: close modal event received');
                this.closeEmailModal();
            });
            
            // Listen for AI reply generation from modal component
            this.$el.addEventListener('generate-ai-reply', (event) => {
                console.log('Main app: generate AI reply event received', event.detail);
                this.handleAIReplyGeneration(event.detail);
            });
            
            // Listen for load more emails from list component
            this.$el.addEventListener('load-more-emails', () => {
                console.log('Main app: load more emails event received');
                this.loadMoreEmails();
            });
        },ortant;
}

/* Reset any margin/padding constraints */
body {
    margin: 0 !important;
    padding: 0 !important;
}

/* Override specific Tailwind max-width classes */
.max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl, .max-w-3xl, .max-w-2xl, .max-w-xl, .max-w-lg, .max-w-md, .max-w-sm {
    max-width: 100vw !important;
}

/* Ensure main container uses full width */
.min-h-screen {
    width: 100vw !important;
    max-width: 100vw !important;
    margin: 0 !important;
    padding: 1rem !important;
}

/* Override mx-auto centering for this page */
.mx-auto {
    margin-left: 0 !important;
    margin-right: 0 !important;
}

/* iPhone-style modal system */
.modal-backdrop {
    backdrop-filter: blur(20px);
    background: rgba(0, 0, 0, 0.6);
}

.modal-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}

.modal-handle {
    width: 48px;
    height: 6px;
    background: rgba(156, 163, 175, 0.6);
    border-radius: 3px;
    margin: 0 auto;
}

/* Enhanced email list with tap targets */
.email-card {
    border-radius: 16px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
}

.email-card:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    border-color: rgba(59, 130, 246, 0.5);
}

.email-card.selected {
    border-color: rgba(59, 130, 246, 0.8);
    background: rgba(59, 130, 246, 0.15);
    transform: translateY(-1px) scale(1.01);
}

.email-card.unread {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(99, 102, 241, 0.1));
    border-color: rgba(59, 130, 246, 0.3);
}

.email-card.unread::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(to bottom, #3b82f6, #6366f1);
    border-radius: 2px 0 0 2px;
}

/* Tab system for modal */
.tab-content {
    min-height: 400px;
}

.tab-button {
    position: relative;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.tab-button.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #3b82f6, #6366f1);
    border-radius: 2px 2px 0 0;
}

/* Smooth scrolling */
.smooth-scroll {
    scroll-behavior: smooth;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

.smooth-scroll::-webkit-scrollbar {
    display: none;
}

/* Glass morphism effects */
.glass-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
}

/* Button animations */
.btn-animate {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-animate:active {
    transform: scale(0.95);
}

.search-section {
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(10px);
}
</style>

<!-- Main Email Management App -->
<div class="min-h-screen w-full p-4" x-data="emailManagementApp()">
    
    <!-- Header and Connection Status -->
    {% include 'email_components/header_section.html' %}
    
    <!-- Email Modal (only shows when email is selected) -->
    {% include 'email_components/email_modal.html' %}
    
    <!-- Agent Selector Modal -->
    {% include 'email_components/agent_selector.html' %}
    
</div>

<!-- Email Management JavaScript -->
<script>
function emailManagementApp() {
    return {
        // State
        isLoading: false,
        errorMessage: '',
        searchQuery: '',
        emails: [],
        nextPageToken: null,
        viewMode: 'detailed',
        connectionStatus: {
            connected: {{ has_gmail_connection|yesno:"true,false" }},
            email: '{{ connected_email|default:"" }}'
        },
        hasScopeIssue: false,

        // Agent and Twin data
        activeAgent: {
            id: '{{ agent_id|default:"" }}',
            name: '{{ agent_name|default:"No Agent Selected" }}',
            twin_version: '{{ twin_version_name|default:"Default" }}'
        },
        availableAgents: [],
        availableTwinVersions: [],
        selectedAgent: '',
        selectedTwinVersion: '',
        selectedTone: 'professional',

        // Modal states - Clean separation
        selectedEmail: null,
        selectedEmailId: null,
        showEmailModal: false,
        showAgentSelector: false,
        
        // Agent selection state
        selectedAgentId: null,
        selectedTwinVersionId: null,
        
        // UI state
        isTransitioning: false,
        isGenerating: false,
        isSending: false,
        
        // Reply tones
        replyTones: [
            { value: 'professional', label: 'Professional', icon: 'fas fa-briefcase' },
            { value: 'friendly', label: 'Friendly', icon: 'fas fa-smile' },
            { value: 'formal', label: 'Formal', icon: 'fas fa-user-tie' },
            { value: 'casual', label: 'Casual', icon: 'fas fa-coffee' }
        ],

        // Options for reply generation
        includeContext: true,
        includeHistory: false,

        // Initialize
        init() {
            console.log('Initializing clean email management app...');
            
            // Clean initial state
            this.selectedEmail = null;
            this.selectedEmailId = null;
            this.showEmailModal = false;
            
            // Event listeners for component communication
            this.setupEventListeners();
            
            // Load initial data
            this.checkConnectionStatus();
            this.loadActiveAgent();
            if (this.connectionStatus.connected) {
                this.loadEmails();
            }
            
            console.log('Clean email app initialized');
        },

        // Event-driven component communication
        setupEventListeners() {
            // Listen for email selection from list component
            this.$el.addEventListener('email-selected', (event) => {
                console.log('Main app: email selected event received', event.detail);
                this.handleEmailSelection(event.detail.email);
            });
            
            // Listen for modal close from modal component
            this.$el.addEventListener('close-email-modal', () => {
                console.log('Main app: close modal event received');
                this.closeEmailModal();
            });
            
            // Listen for AI reply generation from modal component
            this.$el.addEventListener('generate-ai-reply', (event) => {
                console.log('Main app: generate AI reply event received', event.detail);
                this.handleAIReplyGeneration(event.detail);
            });
            
            // Listen for load more emails from list component
            this.$el.addEventListener('load-more-emails', () => {
                console.log('Main app: load more emails event received');
                this.loadMoreEmails();
            });
            
            // Listen for scope errors from modal component
            this.$el.addEventListener('scope-error-detected', () => {
                console.log('Main app: scope error detected from modal');
                this.hasScopeIssue = true;
            });
        },

        // Clean email selection handler
        handleEmailSelection(email) {
            console.log('Handling email selection:', email);
            
            if (!email || !email.id) {
                console.error('Invalid email object:', email);
                return;
            }
            
            // Don't open modal if loading
            if (this.isLoading || this.isTransitioning) {
                console.log('Ignoring email selection - app is busy');
                return;
            }
            
            // Set selected email and open modal
            this.selectedEmail = email;
            this.selectedEmailId = email.id;
            this.showEmailModal = true;
            
            console.log('Email modal should open:', {
                selectedEmail: this.selectedEmail,
                showEmailModal: this.showEmailModal,
                modalCondition: !!(this.showEmailModal && this.selectedEmail && this.selectedEmail.id)
            });
            
            // Prevent background scrolling
            document.body.style.overflow = 'hidden';
        },
        
        // Clean modal close
        closeEmailModal() {
            console.log('Closing email modal');
            
            if (this.isTransitioning) return;
            
            this.isTransitioning = true;
            this.showEmailModal = false;
            
            // Restore background scrolling
            document.body.style.overflow = '';
            
            setTimeout(() => {
                this.selectedEmail = null;
                this.selectedEmailId = null;
                this.isTransitioning = false;
            }, 200);
        },

        // Handle AI reply generation from modal
        async handleAIReplyGeneration(data) {
            console.log('Handling AI reply generation:', data);
            
            // Set the form data from modal
            this.selectedAgentId = data.agentId;
            this.selectedTwinVersionId = data.twinVersionId;
            this.selectedTone = data.tone;
            this.includeContext = data.includeContext || false;
            this.includeHistory = data.includeHistory || false;
            
            // Generate the reply
            await this.generateAIReply();
        },

        // API Methods
        async checkConnectionStatus() {
            try {
                console.log('Checking Gmail connection status...');
                
                const response = await fetch('/api/gmail/status/', {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        this.connectionStatus = {
                            connected: result.connected,
                            email: result.email || ''
                        };
                        console.log('Connection status updated:', this.connectionStatus);
                        
                        // Check for scope issues if connected
                        if (result.connected) {
                            this.checkScopeStatus();
                        }
                    }
                } else {
                    console.error('Error checking connection status:', response.status);
                }
                
            } catch (error) {
                console.error('Error checking connection status:', error);
            }
        },

        async checkScopeStatus() {
            try {
                console.log('Checking Gmail scope status...');
                
                const response = await fetch('/api/gmail/check-scope/', {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        this.hasScopeIssue = result.has_scope_issue || false;
                        console.log('Scope status updated:', { hasScopeIssue: this.hasScopeIssue });
                        
                        if (this.hasScopeIssue) {
                            console.log('Gmail scope issue detected:', result.message);
                        }
                    }
                } else {
                    console.error('Error checking scope status:', response.status);
                }
                
            } catch (error) {
                console.error('Error checking scope status:', error);
            }
        },

        reauthorizeGmail() {
            console.log('Starting Gmail re-authorization...');
            
            const confirmReauth = confirm(
                'Gmail permissions need to be updated to send emails.\n\n' +
                'Would you like to re-authorize with the required permissions?\n\n' +
                'This will redirect you to Google to grant additional permissions.'
            );
            
            if (confirmReauth) {
                // Redirect to re-authorization endpoint
                window.location.href = '/email/reauthorize/';
            }
        },

        async loadActiveAgent() {
            try {
                console.log('Loading active agent...');
                
                const response = await fetch('/api/agents/active/', {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.agent) {
                        this.activeAgent = {
                            id: result.agent.id,
                            name: result.agent.name,
                            twin_version: result.agent.twin_version_name || 'Default'
                        };
                        console.log('Active agent loaded:', this.activeAgent);
                    } else {
                        console.log('No active agent found, using default');
                        this.activeAgent = {
                            id: '',
                            name: 'No Agent Selected',
                            twin_version: 'Default'
                        };
                    }
                } else {
                    console.error('Error loading active agent:', response.status);
                }
                
                // Also load available agents for selection
                await this.loadAvailableAgents();
                
            } catch (error) {
                console.error('Error loading active agent:', error);
            }
        },

        async loadAvailableAgents() {
            try {
                console.log('Loading available agents...');
                
                const response = await fetch('/api/agents/list/', {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        this.availableAgents = result.agents || [];
                        console.log(`Loaded ${this.availableAgents.length} available agents`);
                        
                        // Set default selection if not already set
                        if (this.availableAgents.length > 0 && !this.selectedAgentId) {
                            this.selectedAgentId = this.availableAgents[0].id;
                            await this.loadTwinVersions();
                        }
                    }
                } else {
                    console.error('Error loading available agents:', response.status);
                }
                
            } catch (error) {
                console.error('Error loading available agents:', error);
            }
        },

        async loadTwinVersions() {
            if (!this.selectedAgentId) return;
            
            try {
                console.log('Loading twin versions for agent:', this.selectedAgentId);
                
                const response = await fetch(`/api/twins/versions/?agent_id=${this.selectedAgentId}`, {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        this.availableTwinVersions = result.versions || [];
                        console.log(`Loaded ${this.availableTwinVersions.length} twin versions`);
                        
                        // Auto-select first version if available
                        if (this.availableTwinVersions.length > 0 && !this.selectedTwinVersionId) {
                            this.selectedTwinVersionId = this.availableTwinVersions[0].id;
                        }
                    }
                } else {
                    console.error('Error loading twin versions:', response.status);
                }
                
            } catch (error) {
                console.error('Error loading twin versions:', error);
            }
        },

        async loadEmails() {
            if (this.isLoading) return;
            
            this.isLoading = true;
            this.errorMessage = '';
            
            try {
                console.log('Loading emails from Gmail API...');
                
                const response = await fetch('/api/gmail/emails/', {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Gmail not connected. Please connect your Gmail account.');
                    }
                    throw new Error(`Failed to load emails: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    this.emails = result.data.emails || [];
                    this.nextPageToken = result.data.next_page_token;
                    console.log(`Loaded ${this.emails.length} emails from Gmail`);
                } else {
                    throw new Error(result.error || 'Failed to load emails');
                }
                
            } catch (error) {
                console.error('Error loading emails:', error);
                this.errorMessage = error.message || 'Failed to load emails. Please try again.';
                
                // Update connection status if auth error
                if (error.message.includes('not connected')) {
                    this.connectionStatus.connected = false;
                }
            } finally {
                this.isLoading = false;
            }
        },

        async refreshEmails() {
            console.log('Refreshing emails...');
            this.emails = [];
            this.nextPageToken = null;
            await this.loadEmails();
        },

        async searchEmails() {
            console.log('Searching emails with query:', this.searchQuery);
            
            this.isLoading = true;
            this.errorMessage = '';
            
            try {
                const params = new URLSearchParams();
                if (this.searchQuery) {
                    params.append('query', this.searchQuery);
                }
                params.append('max_results', '20');
                
                const response = await fetch(`/api/gmail/emails/?${params}`, {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        this.emails = result.data.emails || [];
                        this.nextPageToken = result.data.next_page_token;
                        console.log(`Found ${this.emails.length} emails matching search`);
                    }
                }
                
            } catch (error) {
                console.error('Error searching emails:', error);
                this.errorMessage = 'Failed to search emails. Please try again.';
            } finally {
                this.isLoading = false;
            }
        },

        clearSearch() {
            this.searchQuery = '';
            this.refreshEmails();
        },

        async loadUnreadEmails() {
            console.log('Loading unread emails...');
            this.searchQuery = 'is:unread';
            await this.searchEmails();
        },

        async loadTodayEmails() {
            console.log('Loading today\'s emails...');
            const today = new Date().toISOString().split('T')[0];
            this.searchQuery = `after:${today}`;
            await this.searchEmails();
        },

        toggleViewMode() {
            this.viewMode = this.viewMode === 'compact' ? 'detailed' : 'compact';
            console.log('View mode toggled to:', this.viewMode);
        },

        // AI Reply Generation
        async generateAIReply() {
            if (!this.selectedEmail || !this.selectedAgentId || !this.selectedTwinVersionId) {
                console.error('Missing required data for AI reply generation');
                return;
            }
            
            this.isGenerating = true;
            
            try {
                console.log('Generating AI reply...', {
                    emailId: this.selectedEmail.id,
                    agentId: this.selectedAgentId,
                    twinVersionId: this.selectedTwinVersionId,
                    tone: this.selectedTone
                });
                
                const response = await fetch('/api/email/generate-reply/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email_id: this.selectedEmail.id,
                        agent_id: this.selectedAgentId,
                        twin_version_id: this.selectedTwinVersionId,
                        tone: this.selectedTone,
                        additional_context: this.includeContext ? 'Include original email context' : ''
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        // Populate the reply form with generated content
                        this.populateReplyForm(result.reply_data);
                        console.log('AI reply generated successfully');
                        
                        // Close agent selector if open
                        this.showAgentSelector = false;
                    } else {
                        throw new Error(result.error || 'Failed to generate reply');
                    }
                } else {
                    throw new Error(`Server error: ${response.status}`);
                }
                
            } catch (error) {
                console.error('Error generating AI reply:', error);
                alert(`Failed to generate AI reply: ${error.message}`);
            } finally {
                this.isGenerating = false;
            }
        },

        populateReplyForm(replyData) {
            console.log('Populating reply form with data:', replyData);
            
            // Directly update the modal if it's open
            if (this.showEmailModal && this.selectedEmail) {
                // Trigger a custom event that the modal can listen to
                const event = new CustomEvent('reply-generated', {
                    detail: { replyData: replyData },
                    bubbles: true
                });
                
                // Dispatch on document so modal can catch it
                document.dispatchEvent(event);
                
                // Also try dispatching on the modal element if it exists
                const modalElement = document.querySelector('[x-data*="emailModalComponent"]');
                if (modalElement) {
                    modalElement.dispatchEvent(event);
                }
                
                console.log('Reply generated event dispatched via CustomEvent');
            }
        },

        // Load more emails with pagination
        async loadMoreEmails() {
            if (!this.nextPageToken || this.isLoading) return;
            
            this.isLoading = true;
            
            try {
                console.log('Loading more emails with token:', this.nextPageToken);
                
                const params = new URLSearchParams();
                params.append('page_token', this.nextPageToken);
                params.append('max_results', '20');
                
                const response = await fetch(`/api/gmail/emails/?${params}`, {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        // Append new emails to existing list
                        this.emails = [...this.emails, ...result.data.emails];
                        this.nextPageToken = result.data.next_page_token;
                        console.log(`Loaded ${result.data.emails.length} more emails`);
                    }
                }
                
            } catch (error) {
                console.error('Error loading more emails:', error);
            } finally {
                this.isLoading = false;
            }
        },

        // Utility methods
        formatDate(date) {
            if (!date) return '';
            const now = new Date();
            const emailDate = new Date(date);
            const diffTime = Math.abs(now - emailDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 1) {
                return 'Today';
            } else if (diffDays === 2) {
                return 'Yesterday';
            } else if (diffDays <= 7) {
                return `${diffDays - 1} days ago`;
            } else {
                return emailDate.toLocaleDateString();
            }
        },

        formatDetailedDate(date) {
            if (!date) return '';
            return new Date(date).toLocaleString();
        }
    }
}
</script>
