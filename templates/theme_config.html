<!-- Theme Configuration - Include this in all templates for consistent theming -->
<style>
    /* ==========================================================================
       CENTRALIZED THEME CONFIGURATION
       ========================================================================== */
    
    :root {
        /* ===== PRIMARY COLORS ===== */
        --color-primary: #3b82f6;
        --color-primary-hover: #2563eb;
        --color-primary-dark: #1d4ed8;
        --color-secondary: #8b5cf6;
        --color-accent: #06b6d4;
        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-error: #ef4444;
        --color-info: #0ea5e9;
        
        /* ===== LIGHT THEME ===== */
        /* Backgrounds */
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #f1f5f9;
        --bg-quaternary: #e2e8f0;
        --bg-glass: rgba(255, 255, 255, 0.1);
        --bg-glass-strong: rgba(255, 255, 255, 0.15);
        --bg-overlay: rgba(0, 0, 0, 0.5);
        
        /* Text Colors */
        --text-primary: #1f2937;
        --text-secondary: #4b5563;
        --text-tertiary: #6b7280;
        --text-quaternary: #9ca3af;
        --text-inverse: #ffffff;
        --text-muted: #94a3b8;
        
        /* Border Colors */
        --border-primary: #e5e7eb;
        --border-secondary: #d1d5db;
        --border-tertiary: #9ca3af;
        --border-glass: rgba(255, 255, 255, 0.2);
        --border-focus: rgba(59, 130, 246, 0.5);
        
        /* Shadow Colors */
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        
        /* Gradient */
        --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --bg-gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        
        /* Component Specific Colors */
        --card-bg: var(--bg-primary);
        --card-border: var(--border-primary);
        --card-shadow: var(--shadow-md);
        --input-bg: #f9fafb;
        --input-border: var(--border-primary);
        --input-focus-border: var(--color-primary);
        --button-primary-bg: var(--color-primary);
        --button-primary-hover: var(--color-primary-hover);
        --dropdown-bg: var(--bg-primary);
        --dropdown-border: var(--border-primary);
        --dropdown-shadow: var(--shadow-lg);
    }
    
    [data-theme="dark"] {
        /* ===== DARK THEME ===== */
        /* Backgrounds */
        --bg-primary: #111827;
        --bg-secondary: #1f2937;
        --bg-tertiary: #374151;
        --bg-quaternary: #4b5563;
        --bg-glass: rgba(0, 0, 0, 0.3);
        --bg-glass-strong: rgba(0, 0, 0, 0.5);
        --bg-overlay: rgba(0, 0, 0, 0.7);
        
        /* Text Colors */
        --text-primary: #f9fafb;
        --text-secondary: #d1d5db;
        --text-tertiary: #9ca3af;
        --text-quaternary: #6b7280;
        --text-inverse: #111827;
        --text-muted: #64748b;
        
        /* Border Colors */
        --border-primary: #374151;
        --border-secondary: #4b5563;
        --border-tertiary: #6b7280;
        --border-glass: rgba(255, 255, 255, 0.1);
        --border-focus: rgba(96, 165, 250, 0.5);
        
        /* Shadow Colors */
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.6);
        --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.7);
        
        /* Gradient */
        --bg-gradient: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        --bg-gradient-secondary: linear-gradient(135deg, #581c87 0%, #7c2d12 100%);
        
        /* Component Specific Colors */
        --card-bg: var(--bg-secondary);
        --card-border: var(--border-primary);
        --card-shadow: var(--shadow-lg);
        --input-bg: var(--bg-tertiary);
        --input-border: var(--border-secondary);
        --input-focus-border: #60a5fa;
        --button-primary-bg: #60a5fa;
        --button-primary-hover: #3b82f6;
        --dropdown-bg: var(--bg-secondary);
        --dropdown-border: var(--border-primary);
        --dropdown-shadow: var(--shadow-xl);
        
        /* Dark theme adjustments for primary colors */
        --color-primary: #60a5fa;
        --color-primary-hover: #3b82f6;
        --color-secondary: #a78bfa;
        --color-accent: #22d3ee;
        --color-success: #34d399;
        --color-warning: #fbbf24;
        --color-error: #f87171;
        --color-info: #38bdf8;
    }
    
    /* ==========================================================================
       UTILITY CLASSES FOR THEME-AWARE COMPONENTS
       ========================================================================== */
    
    /* Theme-aware base styles */
    body {
        background: var(--bg-gradient);
        color: var(--text-primary);
        transition: all 0.3s ease;
    }
    
    /* Card Components */
    .theme-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        box-shadow: var(--card-shadow);
        transition: all 0.3s ease;
    }
    
    .theme-card:hover {
        box-shadow: var(--shadow-lg);
        transform: translateY(-1px);
    }
    
    /* Glass Components */
    .theme-glass {
        background: var(--bg-glass);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-glass);
    }
    
    .theme-glass-strong {
        background: var(--bg-glass-strong);
        backdrop-filter: blur(25px);
        border: 1px solid var(--border-glass);
    }
    
    /* Text Utilities */
    .theme-text-primary { color: var(--text-primary); }
    .theme-text-secondary { color: var(--text-secondary); }
    .theme-text-tertiary { color: var(--text-tertiary); }
    .theme-text-muted { color: var(--text-muted); }
    .theme-text-inverse { color: var(--text-inverse); }
    
    /* Background Utilities */
    .theme-bg-primary { background-color: var(--bg-primary); }
    .theme-bg-secondary { background-color: var(--bg-secondary); }
    .theme-bg-tertiary { background-color: var(--bg-tertiary); }
    
    /* Border Utilities */
    .theme-border { border-color: var(--border-primary); }
    .theme-border-secondary { border-color: var(--border-secondary); }
    
    /* Input Components */
    .theme-input {
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--text-primary);
        transition: all 0.2s ease;
    }
    
    .theme-input:focus {
        outline: none;
        border-color: var(--input-focus-border);
        box-shadow: 0 0 0 3px var(--border-focus);
    }
    
    .theme-input::placeholder {
        color: var(--text-tertiary);
    }
    
    /* Button Components */
    .theme-button-primary {
        background: var(--button-primary-bg);
        color: var(--text-inverse);
        border: 1px solid var(--button-primary-bg);
        transition: all 0.2s ease;
    }
    
    .theme-button-primary:hover {
        background: var(--button-primary-hover);
        border-color: var(--button-primary-hover);
        transform: translateY(-1px);
    }
    
    .theme-button-secondary {
        background: transparent;
        color: var(--text-primary);
        border: 1px solid var(--border-primary);
        transition: all 0.2s ease;
    }
    
    .theme-button-secondary:hover {
        background: var(--bg-secondary);
        border-color: var(--border-secondary);
    }
    
    /* Dropdown Components */
    .theme-dropdown {
        background: var(--dropdown-bg);
        border: 1px solid var(--dropdown-border);
        box-shadow: var(--dropdown-shadow);
    }
    
    /* Status Colors */
    .theme-status-success {
        background: rgba(16, 185, 129, 0.1);
        color: var(--color-success);
        border-color: rgba(16, 185, 129, 0.2);
    }
    
    .theme-status-warning {
        background: rgba(245, 158, 11, 0.1);
        color: var(--color-warning);
        border-color: rgba(245, 158, 11, 0.2);
    }
    
    .theme-status-error {
        background: rgba(239, 68, 68, 0.1);
        color: var(--color-error);
        border-color: rgba(239, 68, 68, 0.2);
    }
    
    .theme-status-info {
        background: rgba(14, 165, 233, 0.1);
        color: var(--color-info);
        border-color: rgba(14, 165, 233, 0.2);
    }
    
    /* Color scheme utilities for different states */
    .theme-selected {
        background: rgba(59, 130, 246, 0.1);
        border-color: var(--color-primary);
        color: var(--color-primary);
    }
    
    .theme-hover {
        transition: all 0.2s ease;
    }
    
    .theme-hover:hover {
        background: var(--bg-secondary);
        border-color: var(--border-secondary);
    }
    
    /* Scrollbar theming */
    .theme-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: var(--border-secondary) transparent;
    }
    
    .theme-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    
    .theme-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }
    
    .theme-scrollbar::-webkit-scrollbar-thumb {
        background-color: var(--border-secondary);
        border-radius: 3px;
    }
    
    .theme-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: var(--text-tertiary);
    }
</style>
