<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UI Test</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="p-8">
        <h1 class="text-2xl font-bold mb-4">Chat UI Dropdown Test</h1>
        
        <!-- Test Dropdown with High Z-Index -->
        <div class="relative z-50 mb-8" x-data="{ open: false }">
            <button @click="open = !open" 
                    class="bg-purple-50 hover:bg-purple-100 text-purple-600 px-4 py-2 rounded-2xl border border-purple-200 flex items-center">
                <i class="fas fa-layer-group mr-2"></i>
                <span>Test Dropdown</span>
                <i class="fas fa-chevron-down ml-2"></i>
            </button>
            
            <div x-show="open" 
                 @click.away="open = false" 
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 class="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden"
                 style="z-index: 9999;">
                <div class="p-4">
                    <div class="font-semibold text-gray-900 mb-2">Test Options</div>
                    <button class="w-full text-left p-2 hover:bg-gray-50 rounded-lg">Option 1</button>
                    <button class="w-full text-left p-2 hover:bg-gray-50 rounded-lg">Option 2</button>
                    <button class="w-full text-left p-2 hover:bg-gray-50 rounded-lg">Option 3</button>
                </div>
            </div>
        </div>
        
        <!-- Test Chat Container -->
        <div class="bg-white rounded-3xl shadow-xl h-96 border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-200">
                <h3 class="font-semibold">Chat Container</h3>
                <p class="text-sm text-gray-600">This simulates the chat area that was covering the dropdown</p>
            </div>
            <div class="flex-1 p-4">
                <p class="text-gray-700">The dropdown above should appear on top of this container when opened.</p>
                <p class="text-gray-700 mt-2">If you can see the full dropdown without scrolling, the z-index fix is working!</p>
            </div>
        </div>
    </div>
</body>
</html>
